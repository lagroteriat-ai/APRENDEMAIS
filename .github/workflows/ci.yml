name: CI

# Só verificação. Deploy e Preview URLs são do Workers Builds (docs/devops/ambientes.md §4); o Workers Builds
# não espera este CI, então proteja `main` e `producao` exigindo o job "lint · typecheck · test · build".

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verificar:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versão vem de "packageManager" no package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unitário + integração (Vitest/workerd) com relatório JUnit por pacote + testes da landing legada.
      - run: pnpm test:ci
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-vitest
          path: "**/reports/junit.xml"
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm build
      # Valida os wrangler.toml (staging/prod) sem deploy nem credenciais.
      - run: pnpm check:wrangler
      # Worker da landing de verdade (wrangler dev + D1 local): API, painel e "docs/ e apps/ não são servidos" (SR-21).
      - run: pnpm smoke:legado
      # PEN-039: seed em dia com data/curriculo/ e schema da plataforma do zero (migrations + seed) num D1 local.
      - run: node db/seeds/gerar-curriculo.mjs --check
      - name: Migrations + seed do zero (D1 local)
        working-directory: apps/api
        run: |
          pnpm exec wrangler d1 migrations apply DB --local
          pnpm exec wrangler d1 execute DB --local --file ../../db/seeds/curriculo.sql

  e2e:
    name: e2e (Playwright · Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:install
      # O próprio Playwright sobe a landing (pnpm build:legacy + wrangler dev); ver playwright.config.ts.
      - run: pnpm test:e2e
      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
            reports/e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 14
