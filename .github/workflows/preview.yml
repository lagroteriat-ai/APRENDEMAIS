name: Preview

# Sobe uma VERSÃO (não promove) de cada Worker no ambiente staging, com Preview URL por PR.
# Pré-requisitos (docs/devops/ambientes.md §3–4): recursos de staging criados, IDs no wrangler.toml,
# Workers de staging já criados uma vez com deploy manual e secrets CLOUDFLARE_* no environment "staging".
# Sem isso o job só registra um aviso e não falha o PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  preview:
    name: preview (versão + Preview URL)
    # PRs de forks não recebem secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verificar pré-requisitos
        id: pre
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Preview ignorado: secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID ausentes."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          elif ! node scripts/check-placeholders.mjs staging; then
            echo "::notice::Preview ignorado: placeholders COLOQUE_* pendentes no wrangler.toml (staging)."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pre.outputs.pronto == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.pre.outputs.pronto == 'true'
        run: pnpm build
      - name: Enviar versões (api, web, legada)
        if: steps.pre.outputs.pronto == 'true'
        run: |
          set -o pipefail
          MSG="PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}"
          echo "### Preview URLs ($ALIAS)" >> "$GITHUB_STEP_SUMMARY"
          for dir in apps/api apps/web .; do
            (cd "$dir" && pnpm exec wrangler versions upload --env staging --preview-alias "$ALIAS" --message "$MSG") | tee /tmp/saida.txt
            echo "- \`$dir\`: $(grep -Eo 'https://[^ ]+workers\.dev' /tmp/saida.txt | head -n 1)" >> "$GITHUB_STEP_SUMMARY"
          done
