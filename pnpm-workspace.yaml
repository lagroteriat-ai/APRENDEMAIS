packages:
  - apps/*
  - packages/*

# Scripts de instalação permitidos (binários do runtime local do Workers).
allowBuilds:
  esbuild: true
  workerd: true

# Releases recentes liberadas da quarentena do pnpm (adicionado pelo próprio pnpm no 1º install).
minimumReleaseAgeExclude:
  - miniflare@5.20261019.2-beta
  - wrangler@4.152.0
  - "@cloudflare/vitest-plugin@1.4.7"

# Versões únicas para o monorepo inteiro (use "catalog:" nos package.json).
catalog:
  "@axe-core/playwright": ^4.14.0
  "@cloudflare/vitest-plugin": ^1.4.7
  "@playwright/test": ^1.64.1
  "@cloudflare/workers-types": ^5.20261019.1
  "@noble/hashes": ^2.4.0
  "@eslint/js": ^10.0.1
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.1
  "@types/jest-axe": ^3.5.9
  "@types/node": ^22.19.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  eslint: ^10.13.0
  globals: ^17.13.0
  hono: ^4.13.13
  jest-axe: ^10.0.0
  jsdom: ^30.1.3
  msw: ^3.0.3 # mock da API no navegador (apps/web, dev) e nos testes
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.0
  typescript: ^6.0.3 # typescript-eslint ainda não suporta TS 7
  typescript-eslint: ^8.72.0
  vite: ^8.3.5
  vitest: ^4.1.12 # @cloudflare/vitest-pool-workers (testes do Worker) exige Vitest 4.1.x; subir junto com ele
  wrangler: ^4.152.0
  zod: ^4.6.7
