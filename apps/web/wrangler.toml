# Worker da SPA (Static Assets, ADR-002), só estáticos: sem bindings nem secrets.
# Topo = DEV; staging/produção em [env.*]. Build: `pnpm --filter @aprendemais/web build` → dist/.
# Em dev local a SPA roda no Vite (proxy /api/v1 → wrangler dev da API); este Worker é para deploy.
# Produção no mesmo host da API: adicionar `routes = [{ pattern = "DOMINIO/*", zone_name = "DOMINIO" }]`.

name = "aprende-mais-web-dev"
compatibility_date = "2026-09-29"
# Topo = DEV só local: sem URL pública (PEN-056).
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.staging]
name = "aprende-mais-web-staging"
workers_dev = true
preview_urls = true

[env.staging.assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.production]
name = "aprende-mais-web"
workers_dev = true # desligar depois de apontar o domínio
preview_urls = false

[env.production.assets]
directory = "./dist"
not_found_handling = "single-page-application"
